# I/O PARAMS
# INPUT
data_path_img: '/gpfs/data/mayerhoeferlab/projects/myeloma/process_dicoms_for_mars/images_h5/' # path to directory housing h5 files
train_datapath_csv: '/gpfs/data/mayerhoeferlab/projects/myeloma/datafiles_for_mars/dfs_with_bone_segmentation/train_df_with_ct_bone_segmentation.csv' # path to directory housing datafiles (csv files)
val_datapath_csv: '/gpfs/data/mayerhoeferlab/projects/myeloma/datafiles_for_mars/dfs_with_bone_segmentation/val_df_with_ct_bone_segmentation.csv' # path to directory housing datafiles (csv files)

# OUTPUT
output: "/gpfs/data/mayerhoeferlab/projects/myeloma/results/train/train_single_mipview_2D_bone_seg_1-2-26/no_dilation/"

# MODEL PARAMS
arch: 'resnet34'  # model architecture (default: resnet34)
checkpoint: '/gpfs/data/mayerhoeferlab/projects/lars/lars-avg-max_chpt/LARS_trained_state-dict_0.pth'  # model checkpoint
seed_index: 0 # which model index are we using ( should match the index in checkpoint) 
run: 0 # repetition run index
checkpoint_folder: ''
resume: false # resume from checkpoint

# OPTIMIZATION PARAMS
optimizer: 'sgd'
lr: 0.001
lr_anneal: 15
momentum: 0.9
wd: 0.01

# TRAINING PARAMS
batch_size: 128
nepochs: 30
workers: 6
balance: false
early_stopping: false
fast_dev_run: false  # if true, runs a single batch for train, val, and test to check that the code runs without errors
skip_eval_on_training: true # if true, skip evaluation on the training set after the training epoch is completed (will cut down time significantly)

# LR SCHEDULING PARAMS
lr_scheduler: "cosine_with_warm_restarts"
lr_scheduler_min_lr: 0.000001
lr_scheduler_cycle_length: 5  # T_0 parameter for CosineAnnealingWarmRestarts
lr_scheduler_warm_restarts_multiplier: 2  # T_mult parameter for CosineAnnealingWarmRestarts
#lr_scheduler_patience: 1
#lr_scheduler_reduction_factor: 0.1

# LOGGING PARAMS
log_mipview_aggregation: true
log_example_images: true
WANDB_tags: ['postfilter_variation', 'flip_horizontal', 'cosine_warm_restarts', '2D_bone_segmentation']

# DATA PARAMS
#combine_mipviews: 'feature_concatenation'
#feature_concat_divide_weights: true
ct_mode: 'BONE_SEG_MASK_MULTIPLY'
#ct_bone_seg_dilation_erosion: None
#ct_bone_seg_dilation_alone: None
normalize: true
postfilter_fwhm_xy_mm: 6.4  # target postfilter fwhm in mm (default: 6.4mm)
target_label_name: 'PET_jco'  # name of the target label column in the csv files

# TRANSFORM PARAMS
augm: 3
postfilter_fwhm_xy_mm_min: 3.0
postfilter_fwhm_xy_mm_max: 35.0

#normalize_mean: 0.6763
#normalize_std: 1.6433