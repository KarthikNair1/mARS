# I/O PARAMS
# INPUT
data_path_img: '/gpfs/data/mayerhoeferlab/projects/myeloma/process_dicoms_for_mars/images_h5/' # path to directory housing h5 files
train_datapath_csv: '/gpfs/data/mayerhoeferlab/projects/myeloma/datafiles_for_mars/train_df.csv' # path to directory housing datafiles (csv files)
val_datapath_csv: '/gpfs/data/mayerhoeferlab/projects/myeloma/datafiles_for_mars/val_df.csv' # path to directory housing datafiles (csv files)

# OUTPUT
output: "/gpfs/data/mayerhoeferlab/projects/myeloma/results/train_3d/find_normalization_parameters/try_suspected_best_combinations/"

# MODEL PARAMS
arch: 'resnet34'  # model architecture (default: resnet34)
checkpoint: "/gpfs/data/mayerhoeferlab/projects/lars/lars3d_chpt/LARS_trained_state-dict_0.pth" # model checkpoint
seed_index: 0 # which model index are we using ( should match the index in checkpoint) 
run: 0 # repetition run index
checkpoint_folder: ''
resume: false # resume from checkpoint

# OPTIMIZATION PARAMS
optimizer: 'sgd'
lr: 0.001
lr_anneal: 15
momentum: 0.9
wd: 0.0001

# TRAINING PARAMS
batch_size: 16
nepochs: 5
workers: 6
balance: false
lr_scheduler: false
early_stopping: false
fast_dev_run: false  # if true, runs a single batch for train, val, and test to check that the code runs without errors

# LOGGING PARAMS
log_mipview_aggregation: true
log_example_images: true
WANDB_tags: ['3D', 'postfiltering', 'find_normalization_parameters']


# DATA PARAMS
normalize: true
postfilter_fwhm_xy_mm: 6.4  # target postfilter fwhm in mm (default: 6.4mm)
target_label_name: 'PET_jco'  # name of the target label column in the csv files

# TRANSFORM PARAMS
augm: 0
#postfilter_fwhm_xy_mm_min: 3.0
#postfilter_fwhm_xy_mm_max: 9.8

normalize_mean: 0.0384886
normalize_std: 107.312
fixed_suv_clip: 11.524
